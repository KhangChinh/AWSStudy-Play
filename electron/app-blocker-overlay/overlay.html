<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Blocked</title>
  <style>
    :root {
      --bg: #1e1e24;
      --bg-secondary: #2a2a32;
      --red-accent: #ff5555;
      --text-main: #ffffff;
      --text-sub: #a0a0aa;
      --border-color: #33333c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 4px;
    }

    .overlay-card {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideIn {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .icon-wrapper {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #2a2a32;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon {
      font-size: 18px;
      line-height: 1;
    }

    .title-group {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 11.5px;
      color: var(--text-sub);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reason-box {
      font-size: 12px;
      color: #e0e0e0;
      line-height: 1.4;
      padding: 10px 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      margin-bottom: 12px;
      position: relative;
    }

    .reason-box::before {
      content: 'AI VERDICT';
      position: absolute;
      top: -7px;
      left: 10px;
      background: var(--red-accent);
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      border-radius: 4px;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .countdown-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: var(--red-accent);
      border-radius: 3px;
      transition: width 1s linear;
      width: 100%;
    }

    .countdown-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--red-accent);
      min-width: 20px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .btn-kill {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--red-accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-kill:hover {
      background: #ff4040;
    }

    .btn-kill:active {
      background: #e63939;
    }

    .btn-main-text {
      font-size: 13px;
      font-weight: 600;
    }

    .btn-sub-text {
      font-size: 10.5px;
      font-weight: 400;
      opacity: 0.9;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="overlay-card">
    <div class="header">
      <div class="icon-wrapper">
        <div class="icon">🚫</div>
      </div>
      <div class="title-group">
        <div class="title" id="app-name">App Bị Chặn</div>
        <div class="subtitle" id="app-process">process.exe</div>
      </div>
    </div>

    <div class="reason-box" id="reason-text">
      Đang đánh giá ứng dụng...
    </div>

    <div class="countdown-row">
      <span class="countdown-label">Tự đóng sau</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
      <span class="countdown-num" id="countdown-num">10</span>
    </div>

    <button class="btn-kill" id="btn-kill">
      <div class="btn-main-text">Đóng ngay ứng dụng này</div>
      <div class="btn-sub-text">Sẽ không bị tính Strike vi phạm</div>
    </button>
  </div>

  <script>
    const TOTAL = 10;
    let remaining = TOTAL;
    let appProcessName = '';

    window.appBlockerAPI.onCountdownData((data) => {
      appProcessName = data.processName || '';
      document.getElementById('app-name').textContent = data.displayName || data.processName || 'App Bị Chặn';
      document.getElementById('app-process').textContent = data.processName + '.exe';
      document.getElementById('reason-text').textContent = data.reason || 'Ứng dụng giải trí không phù hợp với phiên học tập.';
    });

    const progressBar = document.getElementById('progress-bar');
    const countdownNum = document.getElementById('countdown-num');

    const tick = setInterval(() => {
      remaining--;
      countdownNum.textContent = remaining;
      progressBar.style.width = `${(remaining / TOTAL) * 100}%`;
      
      if (remaining <= 0) {
        clearInterval(tick);
      }
    }, 1000);

    document.getElementById('btn-kill').addEventListener('click', () => {
      clearInterval(tick);
      window.appBlockerAPI.forceCloseApp();
    });
  </script>
</body>
</html>
